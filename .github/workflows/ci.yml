name: ci

on:
  # Only run CI on:
  #   - pushes to main (so we catch a broken main fast)
  #   - PRs targeting main (so we catch breakage before merge)
  # Pushes to non-main branches don't run CI by themselves; the PR run covers them.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Type-check Worker
        run: npx tsc -p tsconfig.json --noEmit

      - name: Type-check + build web
        run: npm -w web run build

      - name: Bundle Worker (dry-run, validates wrangler.toml)
        run: npx wrangler deploy --dry-run --outdir .wrangler/tmp

      - name: Run tests
        run: npm test
