name: ci

on:
  # Only run CI on:
  #   - pushes to main (so we catch a broken main fast)
  #   - PRs targeting main (so we catch breakage before merge)
  # Pushes to non-main branches don't run CI by themselves; the PR run covers them.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Type-check Worker
        run: npx tsc -p tsconfig.json --noEmit

      - name: Type-check + build web
        run: npm -w web run build

      - name: Bundle Worker (dry-run, validates wrangler.toml)
        run: npx wrangler deploy --dry-run --outdir .wrangler/tmp

      - name: Run tests
        run: npm test

  # Pure-C CLI against the real local Worker + seeded D1 (not a JSON fixture).
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Install C build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            libcurl4-openssl-dev \
            pkg-config

      - name: Local Worker secrets for wrangler dev
        run: cp .dev.vars.example .dev.vars

      - name: Build SPA assets (Worker ASSETS binding)
        run: npm -w web run build

      - name: Build CLI
        run: |
          cmake -S cli -B cli/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build cli/build

      - name: CLI reference tests (seed D1 + wrangler dev + diff)
        run: cli/tests/run_tests.sh cli/build/githost
