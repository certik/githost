name: preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  # One in-flight preview build per PR; cancel older runs on new push.
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Build SPA
        run: npm -w web run build

      - name: Apply migrations (staging mirror)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply githost-mirror-staging --env preview --remote

      - name: Apply migrations (staging app)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply githost-app-staging --env preview --remote

      # `versions upload` creates a versioned preview URL without changing the
      # live preview Worker. Each PR push gets its own unique URL like
      # https://<8-hex>-githost-preview.<acct>.workers.dev. Concurrent PRs do
      # not steamroll each other (they share staging D1s but have isolated URLs).
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output=$(npx wrangler versions upload --env preview \
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.sha }}" \
            --tag "pr-${{ github.event.pull_request.number }}" 2>&1 | tee /dev/stderr)
          # Extract the preview URL printed by wrangler (line containing "workers.dev").
          preview_url=$(printf '%s\n' "$output" | grep -Eo 'https://[a-z0-9-]+\.workers\.dev' | head -n1)
          if [ -z "$preview_url" ]; then
            echo "::error::Could not extract preview URL from wrangler output"
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Preview deployed"
            echo
            echo "$preview_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: githost-preview
          message: |
            🚀 **Preview deployed** for commit ${{ github.event.pull_request.head.sha }}

            **URL:** ${{ steps.upload.outputs.preview_url }}

            - Staging databases: `githost-mirror-staging`, `githost-app-staging` (shared across all open PRs)
            - Use `POST /api/refresh` (or the "Manual refresh" button in the UI) to populate the staging mirror DB on first visit.
            - Webhooks point at production; this preview won't auto-update from upstream events.
