name: preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  # One in-flight preview build per PR; cancel older runs on new push.
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Build SPA
        run: npm -w web run build

      - name: Apply migrations (staging mirror)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply githost-mirror-staging --env preview --remote

      - name: Apply migrations (staging app)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply githost-app-staging --env preview --remote

      # `wrangler deploy --env preview` overwrites the stable preview Worker,
      # giving every PR push the same canonical URL:
      # https://githost-preview.<acct>.workers.dev
      #
      # We previously used `wrangler versions upload --env preview` which
      # generates a unique per-version hash subdomain. That broke GitHub OAuth
      # because each hash subdomain would need to be pre-registered as a
      # callback URL with the GitHub App, and GitHub doesn't support wildcards.
      # The stable URL means we register one preview callback and we're done.
      #
      # Trade-off: concurrent PRs stomp each other on the preview Worker. For a
      # single-developer setup that's acceptable; revisit if multiple devs
      # need isolated previews.
      - name: Deploy preview Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --env preview 2>&1 | tee /tmp/wrangler.log
          preview_url=$(awk '/^[[:space:]]+https:\/\/.+\.workers\.dev$/ { print $1; exit }' /tmp/wrangler.log)
          if [ -z "$preview_url" ]; then
            echo "::error::Could not extract preview URL from wrangler output"
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Preview deployed"
            echo
            echo "$preview_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: githost-preview
          message: |
            🚀 **Preview deployed** for commit ${{ github.event.pull_request.head.sha }}

            **URL:** ${{ steps.deploy.outputs.preview_url }}

            - Stable preview URL — overwritten by every PR push (single-dev assumption).
            - Staging databases: `githost-mirror-staging`, `githost-app-staging` (shared across all PRs).
            - Webhooks point at production; preview won't auto-update from upstream events. Sign in and use the "Manual refresh" button.
