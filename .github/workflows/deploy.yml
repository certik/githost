name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Build SPA
        run: npm -w web run build

      # Capture a Time Travel bookmark BEFORE applying migrations. If anything
      # goes wrong we can `wrangler d1 time-travel restore --bookmark <id>`.
      # Logged to the run summary so it's discoverable later. Treated as
      # informational: if bookmark capture fails for any reason we still proceed
      # (the migration itself is the gate, and Time Travel keeps a continuous
      # log on the Cloudflare side regardless of whether we recorded the id).
      - name: Snapshot Time Travel bookmarks (prod)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "## Pre-migration Time Travel bookmarks"
            echo
            echo '### githost-mirror'
            echo '```'
            npx wrangler d1 time-travel info githost-mirror 2>&1 || true
            echo '```'
            echo
            echo '### githost-app'
            echo '```'
            npx wrangler d1 time-travel info githost-app 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations (mirror, prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply githost-mirror --remote

      - name: Apply migrations (app, prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply githost-app --remote

      - name: Deploy Worker (prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
