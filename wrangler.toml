name = "githost"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Frontend SPA served as static assets. Worker runs only when no static file matches
# (and we explicitly call ASSETS.fetch for SPA fallback in our catch-all route).
#
# CRITICAL: `run_worker_first = true` is required because:
#   1. We gate the SPA itself behind a login check in the catch-all route. The
#      Worker must intercept document navigations before Static Assets serves
#      index.html from edge cache.
#   2. /api/*, /auth/*, /webhook/*, /healthz all need the Worker. Without this
#      flag, Cloudflare's Static Assets binding serves SPA index.html for any
#      browser navigation (Sec-Fetch-Mode: navigate) and the Worker never runs.
# The Worker still proxies asset requests to ASSETS.fetch in its catch-all, so
# static files are served — they just go through a thin Worker shim first.
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Mirror of GitHub state — regenerable by replaying webhooks / full resync.
[[d1_databases]]
binding = "MIRROR_DB"
database_name = "githost-mirror"
database_id = "32d625ab-f627-4fca-bf4e-b6087fa777ea"
migrations_dir = "migrations/mirror"

# Irreplaceable local data (AI reviews, local labels, saved views, audit, sessions).
[[d1_databases]]
binding = "APP_DB"
database_name = "githost-app"
database_id = "bdaf81d2-0ada-46ac-a6fd-579818f5ccb5"
migrations_dir = "migrations/app"

# Cached PR diffs (small, bounded by upstream PR count).
[[kv_namespaces]]
binding = "DIFF_CACHE"
id = "babcea2ca8374157bc1405e26c3fb25a"

# Durable Object used by /api/refresh to drive the resync chain via alarms.
# Why a DO and not Worker→Worker self-fetch: Cloudflare caps recursive Worker
# call depth at ~10 nested service-binding calls, so self-fetch chaining
# topped out at ~200 PRs per refresh click. DO alarm() invocations are
# independent (no parent, no stack), so the chain runs as long as it needs.
[[durable_objects.bindings]]
name = "SYNC_CHAIN"
class_name = "SyncChain"

# SQLite-backed DOs (vs the original KV-backed) are free on Workers Free.
# `new_sqlite_classes` opts a NEW class into the SQLite backend; classes
# created with `new_classes` use the older KV backend and require Paid.
[[migrations]]
tag = "v1-sync-chain"
new_sqlite_classes = ["SyncChain"]

# NOTE: Workers Free plan does not include Queues. We use `ctx.waitUntil()` for
# async work instead — the webhook handler returns 200 immediately and continues
# processing in the background. To switch to Queues later, restore the
# `[[queues.producers]]` / `[[queues.consumers]]` stanzas, set `JOBS` in Env,
# and replace `runJob(msg, env, ctx)` calls with `env.JOBS.send(msg)`.

# Cron triggers — DISABLED. We rely on GitHub webhooks for real-time updates
# and the server-side resync chain (POST /api/refresh → chained
# /api/internal/sync-batch calls) for on-demand catch-up. No cron means no
# silent background sync hiding webhook delivery bugs.
[triggers]
crons = []

# Secrets (set via `wrangler secret put NAME`):
#   GITHUB_APP_ID
#   GITHUB_APP_PRIVATE_KEY        # PEM, multi-line
#   GITHUB_WEBHOOK_SECRET
#   GITHUB_OAUTH_CLIENT_ID
#   GITHUB_OAUTH_CLIENT_SECRET
#   SESSION_SECRET                # 32-byte random for cookie signing
#   TOKEN_ENCRYPTION_KEY          # 32-byte base64 for AES-GCM token encryption

# Plain vars (non-secret config).
[vars]
UPSTREAM_OWNER = "lfortran"
UPSTREAM_REPO  = "lfortran"
# Single-installation setup: the GitHub App installation id on UPSTREAM_OWNER/REPO.
# For multi-installation later, replace with a lookup table populated by the
# `installation` / `installation_repositories` webhook events.
GITHUB_INSTALLATION_ID = "132095939"
# Comma-separated list of GitHub logins permitted to sign in. Anyone else is
# rejected at the OAuth callback with an "access denied" page. Keeping this in
# plain vars (not secrets) so we can audit the allowlist from `wrangler.toml`.
ALLOWED_GITHUB_LOGINS = "certik"

# ============================================================================
# Preview environment — shared by all PR previews. Deployed to a separate Worker
# named `githost-preview`, with its own staging D1s and KV. No cron triggers
# (don't contend with prod). Webhooks still point at prod; previews use manual
# refresh from the UI to populate data.
# ============================================================================
[env.preview]
name = "githost-preview"

[env.preview.assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.preview.d1_databases]]
binding = "MIRROR_DB"
database_name = "githost-mirror-staging"
database_id = "64e9e11c-35f1-40de-b51c-19a7375a67db"
migrations_dir = "migrations/mirror"

[[env.preview.d1_databases]]
binding = "APP_DB"
database_name = "githost-app-staging"
database_id = "ff41577f-5112-449e-b005-2d4f93eb9d78"
migrations_dir = "migrations/app"

[[env.preview.kv_namespaces]]
binding = "DIFF_CACHE"
id = "6052b8d7481841cb9200d9398b352eaa"

[env.preview.vars]
UPSTREAM_OWNER = "lfortran"
UPSTREAM_REPO  = "lfortran"
GITHUB_INSTALLATION_ID = "132095939"
ALLOWED_GITHUB_LOGINS = "certik"

# Disable cron triggers on preview — don't contend with prod's nightly resync.
# (Triggers do NOT inherit from the top-level config; we still need to be explicit
# even though our intent is "no triggers".)
[env.preview.triggers]
crons = []


